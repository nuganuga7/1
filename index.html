<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="11월 제철 과일과 타임딜 상품을 만나보세요. 광양 대봉, 겨울 복숭아, 허니듀 멜론 상품 안내.">
  <meta name="theme-color" content="#ffbf00">
  <title>11월 제철 과일</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif}main{max-width:1280px;margin:auto;padding:25px 32px 32px}h1{margin:0 0 49px;background:#ffbf00;border:2px solid #16323d;min-height:81px;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:400;letter-spacing:.03em}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:35px}button.card{display:block;width:100%;padding:0;border:2px solid #16323d;background:#fff;cursor:pointer;overflow:hidden;transition:transform .18s,box-shadow .18s}button.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px #172f3b20}button:focus-visible{outline:4px solid #997000;outline-offset:5px}.card svg{display:block;width:100%;height:auto;aspect-ratio:272/247}h2{margin:18px 0 12px 18px;font-size:26px;font-weight:400}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}footer{margin-top:38px;border-top:1px solid #eee;padding-top:18px;color:#727272;font-size:13px;line-height:1.7}dialog{border:1px solid #d9d9d9;border-radius:16px;padding:28px;width:min(440px,calc(100% - 32px));color:#142b35;box-shadow:0 20px 80px #0003}dialog::backdrop{background:#10232d88}dialog h2{font-size:24px;font-weight:700;margin:8px 0 20px;line-height:1.4}dialog p{line-height:1.7;white-space:pre-line}.price{font-size:20px;font-weight:700}dialog .close{display:block;margin-left:auto;border:0;background:#f3f3f3;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:22px}.notice{font-size:14px;color:#68747a;border-top:1px solid #eee;padding-top:16px}.tag{font-size:12px;letter-spacing:.06em;color:#776100} @media(max-width:900px){main{padding:24px}h1{margin-bottom:30px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}h2{margin-left:0}}@media(max-width:440px){main{padding:18px 16px}h1{min-height:72px;font-size:24px;margin-bottom:24px}.products{gap:14px}h2{font-size:23px;margin-top:24px}}@media(max-width:340px){.products{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){button.card{transition:none}button.card:hover{transform:none}}

    h1{margin-bottom:24px}
    [hidden],button.card[hidden]{display:none!important}
    .search-form{display:flex;gap:10px;max-width:620px;margin:0 auto 12px}
    .search-form input{min-width:0;flex:1;border:1px solid #b7c1c5;border-radius:8px;padding:13px 15px;font:inherit;font-size:16px}
    .search-form input:focus-visible{outline:3px solid #ffbf00;outline-offset:2px}
    .search-form button{border:0;border-radius:8px;padding:12px 22px;background:#16323d;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    .search-form .reset{background:#f1f3f4;color:#16323d;padding:12px}
    .search-status{min-height:22px;margin:0 0 22px;text-align:center;color:#68747a;font-size:14px}
    .deal-heading{display:flex;align-items:center;flex-wrap:wrap;gap:12px 20px;margin:26px 0 14px}
    .deal-heading h2{margin:0}
    .countdown{padding:10px 16px;background:#fff4cd;border:1px solid #f1d277;border-radius:8px;color:#694b00;font-size:15px}
    .countdown strong{margin-left:8px;font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
    .deal-end{width:100%;margin:0;color:#68747a;font-size:13px}
    .empty-state{padding:25px 16px;border:1px dashed #cbd1d4;text-align:center;color:#68747a;border-radius:8px}
    @media(max-width:440px){.search-form{gap:6px;flex-wrap:wrap}.search-form input{flex-basis:60%}.search-form button{padding:12px 15px}.deal-heading{gap:10px}.countdown strong{font-size:19px}}
    .card{text-align:left;font:inherit;color:inherit;border-radius:8px}
    .card .photo{display:block;aspect-ratio:272/220;overflow:hidden;background:#f6f3e9;position:relative}
    .card .photo>img,.card .photo>svg{display:block;width:100%;height:100%;object-fit:cover}
    .card .photo>svg{aspect-ratio:auto}
    .card-body{display:block;padding:16px}.card-name{display:block;font-size:19px;font-weight:700;line-height:1.45}.card-info{display:block;color:#637078;font-size:14px;margin:8px 0;white-space:pre-line}.card-price{display:block;font-size:19px;font-weight:700;color:#16323d;white-space:pre-line;line-height:1.5}.badge{position:absolute;left:10px;top:10px;border-radius:5px;background:#16323d;color:white;padding:6px 10px;font-size:13px}.placeholder{display:grid;height:100%;place-items:center;color:#66745a;font-size:16px}.buy-link{display:block;background:#16323d;color:#fff;text-decoration:none;padding:14px;text-align:center;border-radius:8px}.load-error{padding:20px;background:#fff4cd}footer a{color:#52636b}.error-retry{margin-left:12px;padding:8px 12px} @media(max-width:440px){.card-body{padding:12px}.card-name,.card-price{font-size:16px}}
  </style>
</head>
<body>
  <main>
    <h1 id="site-title">11월 제철 과일</h1>
    <form class="search-form" id="search-form" role="search">
      <label class="sr-only" for="search-input">상품 검색</label>
      <input id="search-input" type="search" placeholder="과일 이름을 검색하세요" autocomplete="off">
      <button type="submit">검색</button>
      <button class="reset" id="search-reset" type="button" hidden>전체 보기</button>
    </form>
    <p class="search-status" id="search-status" role="status">상품명으로 검색해 보세요. 예: 대봉, 복숭아, 멜론</p>
    <section aria-label="제철 과일 상품"><div class="products" id="catalog"></div></section>
    <section aria-labelledby="deal-title" id="sale-section" hidden>
      <div class="deal-heading">
        <h2 id="deal-title">타임세일 상품</h2>
        <div class="countdown"><span id="countdown-label">남은 시간</span><strong id="countdown" role="timer" aria-live="off">--:--:--</strong></div>
        <p class="deal-end">종료: <time id="sale-end"></time> (한국시간)</p>
      </div>
      <div class="products" id="sale-products"></div>
    </section>
    <p class="empty-state" id="search-empty" hidden>검색 결과가 없습니다. 다른 상품명을 입력해 주세요.</p>
    <footer><p id="site-notice">상품 이미지를 누르면 상세 정보를 확인할 수 있습니다.</p><a href="admin/">관리자</a></footer>
  </main>
  <dialog id="product-dialog" aria-labelledby="product-title">
    <button class="close" type="button" aria-label="상세 정보 닫기">×</button>
    <span class="tag">11월 제철 과일</span>
    <h2 id="product-title"></h2>
    <p id="product-description"></p>
    <p class="price" id="product-price"></p>
    <a id="product-buy" class="buy-link" hidden target="_blank" rel="noopener noreferrer">상품 주문하기</a><p class="notice" id="product-notice"></p>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
