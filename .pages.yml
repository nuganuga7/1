media:
  input: assets/uploads
  output: /1/assets/uploads
  extensions: [jpg, jpeg, png, webp, gif]
content:
  - name: settings
    label: 홈페이지 · 타임세일 설정
    type: file
    path: data/settings.json
    format: json
    fields:
      - name: title
        label: 홈페이지 제목
        type: string
        required: true
      - name: notice
        label: 하단 안내 문구
        type: text
      - name: saleEnabled
        label: 타임세일 표시
        type: boolean
      - name: saleEnd
        label: 타임세일 종료 일시 (한국시간)
        type: string
        required: true
        description: '예: 2026-11-07 23:59 — 연도-월-일 시:분 형식으로 입력하세요.'
        pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$'
  - name: products
    label: 상품 관리
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: name
        label: 상품명
        type: string
        required: true
      - name: description
        label: 중량 · 구성 · 설명
        type: text
        required: true
      - name: price
        label: 표시 가격
        type: string
        required: true
        description: '예: 34,000원'
      - name: image
        label: 상품 사진
        type: image
        description: 새 사진을 업로드하면 기존 사진 대신 표시됩니다.
      - name: reference
        label: 기본 사진
        type: select
        options:
          values:
            - name: persimmon
              label: 대봉감
            - name: peach
              label: 복숭아
            - name: melon
              label: 허니듀 멜론
      - name: status
        label: 판매 상태
        type: select
        required: true
        options:
          values:
            - name: selling
              label: 판매 중
            - name: soldout
              label: 품절
            - name: hidden
              label: 홈페이지에서 숨김
      - name: timeSale
        label: 타임세일 상품으로 표시
        type: boolean
      - name: orderUrl
        label: 주문 링크
        type: string
        description: 스마트스토어 등 https://로 시작하는 상품 주소. 비워두면 주문 버튼이 표시되지 않습니다.
